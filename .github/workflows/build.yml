name: Build Desktop Apps

# Teg (v1.0.0 kabi) push qilinganda yoki qo'lda ishga tushiriladi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # release yaratish uchun

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: AIDA-macOS
          - os: windows-latest
            label: Windows
            artifact: AIDA-Windows
          - os: ubuntu-latest
            label: Linux
            artifact: AIDA-Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux tizim kutubxonalari (Qt uchun)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Windows ikonasi (.ico)
        if: runner.os == 'Windows'
        run: python -c "from PIL import Image; Image.open('app/assets/icon.png').save('app/assets/icon.ico')"

      - name: .app / .exe qurish
        run: pyinstaller AIDA.spec --noconfirm

      - name: macOS — quarantine tozalash
        if: runner.os == 'macOS'
        run: xattr -cr dist/AIDA.app || true

      - name: Artefaktni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # Teg push qilinganda barcha platformalarni release'ga biriktiradi
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Artefaktlarni yuklab olish
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Arxivlash
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../${name}.zip" "$d"
          done
          cd ..
          ls -la *.zip

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
